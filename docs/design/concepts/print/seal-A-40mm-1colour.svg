     width="46mm" height="46mm" viewBox="-23 -23 46 46">
  <title>Tantu Kala pack seal A, 40 mm, 1-colour Umber (PK-1 rev 4)</title>
  <desc>
    PRINT ARTWORK, PK-1 rev 4 (21 Oct 2026). Pending a printed proof.
    1-colour version: Umber #4D3126 (~ C0 M36 Y51 K70, rough, not colour-managed) only; no ground colour, so the paper
    (white or kraft) shows through. For kraft: proof separately, because uncoated kraft spreads ink and the mark's gaps may fill in.
    Size: trim = circle 40 mm diameter; canvas 46 x 46 mm includes 3 mm bleed; safe area 36 mm diameter. 1 user unit = 1 mm.
    Layers: ARTWORK (prints) and GUIDES (do not print: bleed, CutContour = trim/cut line, safe area).
    TEXT IS LIVE, NOT OUTLINED: font Karla (Google Fonts, OFL), SemiBold 600, 7 pt.
      Tagline "Art made from threads", letter-spacing 0.15 mm; handle "@tantu_kala_", letter-spacing 0.2 mm.
      Install Karla and convert text to outlines before output, then check the text still sits on its arc.
    Logo: vector redraw, approved for pack printing only (owner, 21 Oct). Simplified small mark 15 mm; wordmark 22 mm wide.
  </desc>
  <style>@import url('https://fonts.googleapis.com/css2?family=Karla:wght@500;600&amp;display=swap');</style>

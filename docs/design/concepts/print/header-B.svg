     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="96mm" height="86mm" viewBox="-3 -3 96 86">
  <title>Tantu Kala header tag B, flat sheet, full colour (PK-1 rev 4)</title>
  <desc>
    PRINT ARTWORK, PK-1 rev 4 (21 Oct 2026). Pending a printed proof. Only for stalls that hang packs on pegs.
    Flat sheet: trim 90 x 80 mm; canvas 96 x 86 mm includes 3 mm bleed on all cut edges. 1 user unit = 1 mm.
    Fold across the middle (y = 40 mm) to a 90 x 40 mm face. Top half = BACK, printed rotated 180 degrees so it
    reads correctly after folding. Bottom half = FRONT.
    Punch: one 6 mm round hole, centred, 7 mm from the fold, through both halves (both positions shown on GUIDES).
    Staples: keep 6 mm at each open edge free (staple zones on GUIDES).
    Stock: 300-350 gsm matte card (assumption; ask the shop).
    Layers: ARTWORK (prints) and GUIDES (do not print: bleed, CutContour = trim/cut line, safe area, fold, punch, staples).
    TEXT IS LIVE, NOT OUTLINED: font Karla (Google Fonts, OFL), 7 pt (2.469 mm).
      Tagline "Art made from threads": SemiBold 600, letter-spacing 0.15 mm. Handle "@tantu_kala_": SemiBold 600 (small light-on-dark type needs the heavier weight).
      Install Karla and convert text to outlines before output.
    Logo: vector redraw, approved for pack printing only (owner, 21 Oct). Front: full mark 26 mm tall + wordmark 40 mm wide
    (horizontal lockup). Back: simplified small mark 20 mm tall.
    Colours (hex, rough CMYK from a simple conversion, not colour-managed):
      Umber #4D3126 ~ C0 M36 Y51 K70 (flood) | logo peach #C58E77 ~ C0 M28 Y40 K23 (mark and wordmark) |
      Warm Ivory #FAF3E7 ~ C0 M3 Y8 K2 (tagline, handle) | Mustard #C99A44 ~ C0 M23 Y66 K21 (divider, decoration only).
  </desc>
